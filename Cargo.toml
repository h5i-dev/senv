[package]
name = "senv"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "senv — OpenEnv-compatible RL environments in Rust, executed on h5i-app."
license = "Apache-2.0"
repository = "https://github.com/h5i-dev/senv"

[[bin]]
name = "senv"
path = "src/main.rs"

[dependencies]
# Pinned to the h5i commit whose Kernel, MemoryEngine and H5iApp APIs this
# server is written against. The `http` feature is the Axum shell; Echo
# sessions run on MemoryEngine, not on PostgreSQL.
h5i-app = { git = "https://github.com/h5i-dev/h5i", rev = "5e0f8a929c57bb12a321090d98a14b3a2714b849", features = ["http"] }

axum = { version = "0.8", features = ["json", "ws", "query"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# The server reports failures as values. A panic in request handling would
# drop a session without a protocol error.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
overflow-checks = true

[profile.dev]
debug = false
