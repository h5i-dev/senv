[package]
name = "senv"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Serve h5i-app kernels as OpenEnv reinforcement-learning environments."
license = "Apache-2.0"
repository = "https://github.com/h5i-dev/senv"
readme = "README.md"
keywords = ["openenv", "reinforcement-learning", "h5i", "lean", "verification"]
categories = ["science", "web-programming::websocket"]
exclude = ["/examples", "/scripts", "/docs", "/.github"]

[dependencies]
# Only the core contract: `Kernel` and `MemoryEngine`. Environments add the
# h5i-app features they need themselves.
h5i-app = { workspace = true }

axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    ".",
    "examples/echo/kernel",
    "examples/echo/server",
    "examples/wordle/kernel",
    "examples/wordle/server",
    "examples/arith/kernel",
    "examples/arith/server",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
senv = { path = ".", version = "0.3.0" }
h5i-app = { version = "=0.5.5", default-features = false }

axum = { version = "0.8", features = ["json", "ws", "query"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Shells report failures as values. A panic in request handling would drop a
# session without a protocol error.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
overflow-checks = true

[profile.dev]
debug = false
