# Read by `h5i app`: extract, check, prove, mutate, doctor.

[extract]
crate = "kernel"
start-from = ["transition", "apply", "read_only"]

[check]
theorems = [
    "wordle_kernel.Theorems.mark_spec",
    "wordle_kernel.Theorems.all_green_iff",
    "wordle_kernel.Theorems.reward_in_range",
    "wordle_kernel.Theorems.guess_pays",
    "wordle_kernel.Theorems.game_ends",
    "wordle_kernel.Theorems.fresh_moves",
    "wordle_kernel.Theorems.done_is_final",
    "wordle_kernel.Theorems.secret_is_fixed",
]

[obligations]
panic-free = "wordle_kernel.Theorems.panic_free"
read-only = "wordle_kernel.Theorems.read_only_sound"

# Bugs the proofs must reject (`h5i app mutate`). Each `old` occurs once in
# kernel/src/lib.rs.

[[mutant]]
name = "yellow_reuses_a_letter"
old = "                    remaining[j] = CONSUMED;\n"
new = ""

[[mutant]]
name = "green_does_not_consume"
old = "            remaining[i] = CONSUMED;\n"
new = ""

[[mutant]]
name = "loss_pays_like_a_win"
old = "                next.reward_milli = reward_milli;\n                PlayOutcome::Loss { reward_milli }"
new = "                next.reward_milli = WIN_MILLI;\n                PlayOutcome::Loss { reward_milli }"

[[mutant]]
name = "unlimited_invalid_moves"
old = "if core.error_count < ERROR_ALLOWANCE {"
new = "if core.error_count < 255 {"

[[mutant]]
name = "repeats_allowed"
old = "            } else if already_guessed(core, letters) {"
new = "            } else if false && already_guessed(core, letters) {"

[[mutant]]
name = "replay_after_done"
old = "if core.done || core.guess_count >= MAX_GUESSES || core.turn >= MAX_GUESSES {"
new = "if core.guess_count >= MAX_GUESSES || core.turn >= MAX_GUESSES {"
