# senv is a Rust binary. This file exists so `pip install h5i-senv` can install
# that binary. maturin compiles `src/main.rs` and puts `senv` on PATH. It does
# not install a Python library. The OpenEnv client used to talk to the server
# comes from the OpenEnv checkout named in README.md, not from this wheel.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "h5i-senv"
description = "OpenEnv-compatible Echo environment server. Each session runs on an h5i-app MemoryEngine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["openenv", "reinforcement-learning", "echo", "h5i"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The single source of truth for the version is Cargo.toml, which the release
# workflow already checks against the tag. Duplicating it here would give the
# tag two things to disagree with.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/h5i-dev/senv"
Repository = "https://github.com/h5i-dev/senv"
Issues = "https://github.com/h5i-dev/senv/issues"

[tool.maturin]
# No Python extension module: package the `senv` binary itself.
#
# Deliberately no `strip`: the wheel should carry the same binary the tarball
# and `cargo install` produce, built with the same profile. A panic report from
# a pip user is then worth exactly as much as one from anybody else.
bindings = "bin"
