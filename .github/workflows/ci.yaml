name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # install.sh is the path most people will take to get senv, and nothing else
  # in CI executes it. A syntax error in it is invisible until it is being
  # piped into someone's shell.
  packaging:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh -n install.sh
      # POSIX sh, not bash: the script is run by whatever /bin/sh is on the
      # machine curl'ing it, which on Debian and Ubuntu is dash.
      - run: shellcheck --shell=sh install.sh

  check:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms, because a good deal of this code is behind
        # `cfg(target_os)` and a lint that only ever runs on Linux cannot see
        # the macOS half of it at all.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The integration suite drives a real `uv`. Without it those tests skip,
      # which would quietly hide every end-to-end assertion.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # senv is a Rust project that *drives* uv; there is no Python
          # dependency file here for uv's cache key to hash.
          enable-cache: false

      # The install boundary needs a tier that can enforce an egress
      # allowlist. On Linux that is the supervised tier, which needs these.
      - name: Install sandbox prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y slirp4netns nftables

      # Ubuntu 24.04 — which these runners are — ships an AppArmor profile that
      # forbids unprivileged user namespaces. Every senv tier is built on one,
      # so without this `unshare(CLONE_NEWUSER)` fails, both kernel tiers report
      # unavailable, and the whole boundary suite skips itself while the run
      # stays green. That is the failure the guard at the end of this job
      # exists to catch, and this is the line that prevents it.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: What can this runner enforce?
        run: cargo run --locked -- doctor || true

      - run: cargo test --locked -- --nocapture

      # Integration tests skip themselves on a host that cannot confine, so a
      # green suite could mean "nothing ran". Fail loudly instead: this repo's
      # whole claim is that the boundary is real, and CI has to prove it.
      # This guard has already earned its place once, by catching a run in
      # which all 102 boundary assertions were skipped.
      #
      # It runs on both platforms now. Restricting it to Linux left macOS with
      # the exact hole it exists to close, and macOS is where the holes were:
      # the egress allowlist was enforcing nothing there, and a suite that had
      # silently skipped itself would have reported that as green. There is
      # nothing to install for it either — Seatbelt ships with the OS, so a
      # macOS runner that cannot enforce the boundary is a real regression and
      # deserves a red build rather than a skip.
      - name: The boundary was actually exercised
        run: |
          out="$(cargo test --locked --test cli -- --nocapture 2>&1)"
          echo "$out"
          if echo "$out" | grep -q "SKIP:"; then
            echo "::error::integration tests skipped on Linux — the sandbox was not exercised"
            echo "$out" | grep "SKIP:"
            exit 1
          fi
