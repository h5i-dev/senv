name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep this revision aligned with OPENENV_GIT_REVISION in src/lib.rs. The
  # compatibility scripts import the unmodified clients from that tree.
  OPENENV_REVISION: 58d0344011fe961342706c90288f7e842b15b1c9

jobs:
  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --shell=bash scripts/echo_compat.sh scripts/wordle_compat.sh scripts/arith_compat.sh

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: rust 1.88 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  check:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace -- --nocapture

  echo-client:
    name: official OpenEnv clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: openenv/OpenEnv
          ref: ${{ env.OPENENV_REVISION }}
          path: OpenEnv
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/echo-client-requirements.txt
      - run: python -m pip install -r scripts/echo-client-requirements.txt
      - name: Confirm the checkout is the pinned revision
        working-directory: OpenEnv
        run: test "$(git rev-parse HEAD)" = "${{ env.OPENENV_REVISION }}"
      - run: bash scripts/echo_compat.sh
        env:
          OPENENV_SRC: ${{ github.workspace }}/OpenEnv
          SENV_PYTHON: python
          SENV_BIND: 127.0.0.1:8765
      - run: bash scripts/wordle_compat.sh
        env:
          OPENENV_SRC: ${{ github.workspace }}/OpenEnv
          SENV_PYTHON: python
          SENV_BIND: 127.0.0.1:8766
      - run: bash scripts/arith_compat.sh
        env:
          OPENENV_SRC: ${{ github.workspace }}/OpenEnv
          SENV_PYTHON: python
          SENV_BIND: 127.0.0.1:8784

  # The kernels of examples/arith and examples/wordle are h5i app projects.
  # `extract --check`: the committed Lean is what Aeneas extracts from the
  # Rust. `check`: the proofs build with no sorry, native_decide or axiom,
  # every theorem rests on the standard axioms, and the theorems and
  # obligations each h5i-app.toml names are present.
  proofs:
    name: h5i app proofs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AENEAS_REV: b86120db3183b0107eb5f2637b11c424cd06ef1c
      H5I_VERSION: v0.5.5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the h5i CLI
        run: |
          mkdir -p "$RUNNER_TEMP/h5i/bin"
          curl -fsSL --retry 3 https://h5i.dev/install.sh | H5I_INSTALL_DIR="$RUNNER_TEMP/h5i/bin" sh
          echo "$RUNNER_TEMP/h5i/bin" >> "$GITHUB_PATH"
      - name: Install Charon and Aeneas at the pinned commit
        run: bash scripts/install-aeneas.sh "$RUNNER_TEMP/aeneas" >> "$GITHUB_PATH"
      - name: Install elan and the pinned Lean toolchain
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat examples/arith/proofs/lean-toolchain)"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/h5i/lake
          key: lake-${{ hashFiles('examples/*/proofs/lake-manifest.json', 'examples/*/proofs/lean-toolchain') }}
      - run: h5i app doctor examples/arith
      - run: h5i app extract --check examples/arith examples/wordle
      - run: h5i app check examples/arith examples/wordle
