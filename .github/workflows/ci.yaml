name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep these two revisions aligned with src/lib.rs. The Echo client imported
  # by scripts/echo_compat.sh is the OpenEnv tree at the first one. The h5i
  # crate is pinned in Cargo.toml and Cargo.lock.
  OPENENV_REVISION: 58d0344011fe961342706c90288f7e842b15b1c9

jobs:
  packaging:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh -n install.sh
      - run: shellcheck --shell=sh install.sh
      - run: shellcheck --shell=bash scripts/echo_compat.sh

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: rust 1.88 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  check:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -- --nocapture

  echo-client:
    name: official EchoEnv client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: meta-pytorch/OpenEnv
          ref: ${{ env.OPENENV_REVISION }}
          path: OpenEnv
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/echo-client-requirements.txt
      - run: python -m pip install -r scripts/echo-client-requirements.txt
      - name: Confirm the checkout is the pinned revision
        working-directory: OpenEnv
        run: test "$(git rev-parse HEAD)" = "${{ env.OPENENV_REVISION }}"
      - run: bash scripts/echo_compat.sh
        env:
          OPENENV_SRC: ${{ github.workspace }}/OpenEnv
          SENV_PYTHON: python
          SENV_BIND: 127.0.0.1:8765
