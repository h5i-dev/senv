name: Release

# senv is a library. A `v*` tag publishes the `senv` crate to crates.io.
# The example environments under examples/ are `publish = false`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish senv to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/senv
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the crate version
        shell: bash
        run: |
          set -euo pipefail
          crate="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace
      - run: cargo publish --locked -p senv
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
