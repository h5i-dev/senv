# Supply-chain gates for senv.
#
# senv links h5i-app from git. The graph is gated on advisories, licenses, and
# which git hosts a dependency may come from. Run `cargo deny check`. CI runs
# the same command.

[advisories]
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained (RUSTSEC-2026-0173). It is a build-time
    # dependency of hax-lib-macros, pulled in by h5i-app-http → libcrux-hmac →
    # libcrux. There is no fixed release. Retire this ignore when the h5i pin
    # no longer depends on that crate.
    "RUSTSEC-2026-0173",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# h5i-app is not published to crates.io. Cargo.toml pins one commit.
allow-git = ["https://github.com/h5i-dev/h5i"]
