# Supply-chain gates for senv.
#
# senv and its examples link h5i-app from crates.io. The graph is gated on
# advisories, licenses, and which registries and git hosts a dependency may come
# from. Run `cargo deny check`. CI runs the same command.

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
